# The workspace's Rust toolchain. The flake builds every Nix shell and package
# with it, and rustup reads it directly where there is no Nix.
[toolchain]
channel = "nightly-2026-10-01"
components = ["rust-src", "rust-analyzer", "rustfmt", "clippy"]
# The studio's web interface compiles to WebAssembly.
targets = ["wasm32-unknown-unknown"]
