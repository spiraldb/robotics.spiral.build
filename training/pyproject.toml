[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "spiral-training-runtime"
version = "0.1.0"
description = "Remote PyTorch ACT runtime for Spiral Robotics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "adbc-driver-manager>=1.7,<2",
    "fastapi>=0.116,<1",
    "lerobot==0.6.0",
    "numpy>=2.0,<2.3",
    "nvidia-ml-py>=12,<14; sys_platform == 'linux'",
    "psutil>=7,<8",
    "pyarrow>=21,<30",
    "safetensors>=0.4.3,<1",
    "spiraldb==0.16.26",
    "torch>=2.7,<2.8",
    "torchvision>=0.22,<0.23",
    "triton==3.3.1; sys_platform == 'linux'",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
spiral-training-runtime = "spiral_training_runtime.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spiral_training_runtime"]

[tool.hatch.build.targets.wheel.force-include]
"../contracts/boundaries.json" = "spiral_training_runtime/boundaries.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
triton = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
