[package]
name = "spiral-robotics-studio"
version.workspace = true
edition.workspace = true
description = "Product launcher and assets for Spiral Robotics Studio"
publish = false

[lints]
workspace = true

[features]
default = []
web = ["dioxus/web", "spiral-robotics-frontend/web"]
server = [
    "dioxus/cli-config",
    "dioxus/server",
    "dep:spiral-robotics-backend",
]

[dependencies]
spiral-robotics-backend = { workspace = true, optional = true }
spiral-robotics-frontend.workspace = true
dioxus = { workspace = true, features = [
    "launch",
] }

[[bin]]
name = "spiral-robotics-studio"
path = "src/main.rs"
