[package]
name = "spiral-robotics-frontend"
version.workspace = true
edition.workspace = true
description = "Browser interface for Spiral Robotics Studio"
publish = false

[lints]
workspace = true

[dependencies]
charming = { version = "0.6.0", default-features = false }
spiral-robotics-common.workspace = true
spiral-robotics-viewport.workspace = true
dioxus = { workspace = true, features = [
    "asset",
    "document",
    "hooks",
    "html",
    "logger",
    "macro",
    "router",
    "signals",
] }
dioxus-flow.workspace = true
dioxus-workbench.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
serde-wasm-bindgen = "0.6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "=0.2.126"
web-sys = { version = "0.3", features = [
    "Document",
    "DomRect",
    "Element",
    "EventTarget",
    "File",
    "AbortController",
    "AbortSignal",
    "HtmlCanvasElement",
    "HtmlElement",
    "Node",
    "NodeList",
    "PointerEvent",
    "ResizeObserver",
    "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { workspace = true, features = ["web"] }
charming = { version = "0.6.0", default-features = false, features = ["wasm"] }

[dev-dependencies]
spiral-robotics-common = { workspace = true, features = ["test-support"] }
spiral-robotics-viewport = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[build-dependencies]
serde_json.workspace = true
