[package]
name = "spiral-robotics-frontend"
version.workspace = true
edition.workspace = true
description = "Browser interface for Spiral Robotics Studio"
publish.workspace = true

[lints]
workspace = true

[dependencies]
arrow-array = { version = "58.4.0", default-features = false }
arrow-schema = "58.4.0"
arrow-ipc = { version = "58.4.0", default-features = false }
arrow-cast = { version = "58.4.0", default-features = false }
arrow-json = "58.4.0"
base64.workspace = true
console_error_panic_hook = "0.1.7"
wasm-bindgen-futures = "0.4"
wasm-streams = "0.4.2"
charming = { version = "0.6.0", default-features = false, features = ["wasm"] }
spiral-robotics-common.workspace = true
spiral-robotics-ui.workspace = true
spiral-robotics-viewport.workspace = true
dioxus = { workspace = true, features = [
    "asset",
    "document",
    "hooks",
    "html",
    "launch",
    "logger",
    "macro",
    "router",
    "signals",
    "web",
] }
dioxus-flow.workspace = true
dioxus-workbench.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = "1.2"
serde_urlencoded = "0.7"
serde-wasm-bindgen = "0.6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "=0.2.126"
web-sys = { version = "0.3", features = [
    "Document",
    "KeyboardEvent",
    "console",
    "DomRect",
    "Element",
    "EventTarget",
    "File",
    "AbortController",
    "AbortSignal",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "ImageData",
    "Performance",
    "HtmlElement",
    "Node",
    "NodeList",
    "PointerEvent",
    "ResizeObserver",
    "Storage",
    "Window",
] }

[dev-dependencies]
wasm-bindgen-test = "=0.3.76"
spiral-robotics-common = { workspace = true, features = ["test-support"] }
