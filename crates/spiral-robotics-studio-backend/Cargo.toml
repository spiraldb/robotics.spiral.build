[package]
name = "spiral-robotics-studio-backend"
version.workspace = true
edition.workspace = true
description = "Server runtime for Spiral Robotics Studio"
publish = false

[dependencies]
spiral-robotics.workspace = true
spiral-robotics-contracts.workspace = true
spiral-robotics-core.workspace = true
spiral-robotics-training.workspace = true
spiral-robotics-training-http.workspace = true
clap.workspace = true
dioxus = { workspace = true, features = ["cli-config", "server"] }
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["macros"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
parquet = { version = "58.4.0", default-features = false, features = ["arrow", "snap"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
arrow-json = "58.4.0"
adbc_core = "0.24.0"
adbc_driver_manager = "0.24.0"
safetensors = "0.7"
image.workspace = true
tempfile.workspace = true
spiral-robotics-inference.workspace = true
