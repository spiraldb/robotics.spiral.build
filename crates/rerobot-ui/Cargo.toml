# The UI only compiles for wasm32, so it is excluded from the root workspace
# and keeps its own lockfile.
#
# Build it with the Dioxus CLI, which also compiles tailwind.css:
#   dx build --release      (or `dx serve` while developing)
[workspace]

[package]
name = "rerobot-ui"
version = "0.1.0"
edition = "2024"
description = "Dioxus web interface for the rerobot studio"
publish = false

[dependencies]
rerobot-core = { path = "../rerobot-core" }
dioxus = { version = "0.7.10", default-features = false, features = [
    "asset",
    "document",
    "hooks",
    "html",
    "launch",
    "logger",
    "macro",
    "signals",
    "web",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gloo-net = { version = "0.7", default-features = false, features = ["eventsource", "http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# wasm-bindgen refuses to run against a different version of its CLI, so this
# is pinned to the `wasm-bindgen-cli` the dev shell provides. Bump both
# together, never one alone.
wasm-bindgen = "=0.2.126"
# Only what the 3D viewport touches: every feature named here is code the
# bundle carries, so the list is the viewer's actual surface and nothing more.
web-sys = { version = "0.3", features = [
    "Document",
    "DomRect",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "PointerEvent",
    "Storage",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "Window",
] }

[profile.release]
# The bundle is downloaded over localhost, but a smaller module still starts
# faster and keeps the repository's build artifacts manageable.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
# wasm-opt aborts on the DWARF rustc emits here, and the browser has no use for
# it in a release bundle anyway.
strip = "debuginfo"
