# The UI only compiles for wasm32, so it is excluded from the root workspace
# and keeps its own lockfile. Build it with ../../scripts/build-ui.sh.
[workspace]

[package]
name = "rerobot-ui"
version = "0.1.0"
edition = "2024"
description = "Dioxus web interface for the rerobot studio"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rerobot-core = { path = "../rerobot-core" }
dioxus = { version = "0.7.10", default-features = false, features = [
    "document",
    "hooks",
    "html",
    "macro",
    "signals",
    "web",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gloo-net = { version = "0.7", default-features = false, features = ["eventsource", "http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Location"] }

[profile.release]
# The bundle is downloaded over localhost, but a smaller module still starts
# faster and keeps the repository's build artifacts manageable.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
