[package]
name = "spiral-robotics-studio"
version.workspace = true
edition.workspace = true
description = "Product launcher and assets for Spiral Robotics Studio"
publish = false

[lints]
workspace = true

[features]
default = []
web = ["dep:dioxus", "dep:spiral-robotics-frontend"]
server = ["dep:spiral-robotics-backend"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
spiral-robotics-frontend = { workspace = true, optional = true }
dioxus = { workspace = true, features = ["launch", "web"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
spiral-robotics-backend = { workspace = true, optional = true }

[[bin]]
name = "spiral-robotics-studio"
path = "src/main.rs"
