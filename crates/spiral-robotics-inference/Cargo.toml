[package]
name = "spiral-robotics-inference"
version.workspace = true
edition.workspace = true
description = "Native training and inference engine for robot policies"
publish = false

[features]
default = ["cli"]
accelerate = ["burn-ndarray/blas-accelerate"]
# Fusion now sees one recurring training graph between infrequent packed metric
# readbacks, and the Metal regression test exercises repeated train, validation,
# and checkpoint boundaries. CubeCL 0.10 autotuning remains disabled because its
# Metal device-timestamp profiler can invalidate the readback buffer on
# production ACT shapes independently of graph synchronization.
metal = [
    "dep:burn-wgpu",
    "dep:futures-lite",
    "dep:wgpu",
    "burn-wgpu/metal",
]
download = ["dep:dirs", "dep:reqwest", "dep:tempfile", "burn-store/pytorch"]
cli = ["dep:clap", "dep:image", "download"]

[dependencies]
burn-core = { version = "0.21.0", default-features = false, features = ["std"] }
burn-nn = { version = "0.21.0", default-features = false, features = ["std"] }
burn-autodiff = { version = "0.21.0", default-features = false, features = ["std"] }
burn-optim = { version = "0.21.0", default-features = false, features = ["std"] }
burn-store = { version = "0.21.0", default-features = false, features = ["safetensors", "std"] }
burn-ndarray = { version = "0.21.0", default-features = false, features = ["std", "simd", "multi-threads"] }
burn-wgpu = { version = "0.21.0", default-features = false, features = ["std", "fusion"], optional = true }
clap = { workspace = true, features = ["derive"], optional = true }
dirs = { version = "6", optional = true }
futures-lite = { version = "2.6", optional = true }
image = { workspace = true, optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
safetensors = "0.7"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tempfile = { workspace = true, optional = true }
thiserror = "2"
wgpu = { version = "29.0.4", default-features = false, features = ["metal", "std"], optional = true }

[[bin]]
name = "spiral-robotics-infer"
path = "src/bin/infer.rs"
required-features = ["cli"]
