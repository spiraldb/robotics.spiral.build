[package]
name = "spiral-robotics-backend"
version.workspace = true
edition.workspace = true
description = "Server runtime for Spiral Robotics Studio"
publish.workspace = true

[lints]
workspace = true

[dependencies]
spiral-robotics-common.workspace = true
spiral-robotics-storage.workspace = true
base64.workspace = true
clap.workspace = true
dioxus-cli-config = "0.7.10"
# Session IDs and the PKCE verifier of each Spiral sign-in.
getrandom = "0.3"
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
sha2 = "0.10"
axum = "0.8"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["set-header", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arrow-array = "59.2.0"
arrow-buffer = "59.2.0"
arrow-schema = "59.2.0"
arrow-ipc = { version = "59.2.0", features = ["zstd"] }
arrow-cast = "59.2.0"
arrow-select = "59.2.0"
url = "2"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
# Draws Break down's contact sheets from the PPM pictures FFmpeg decodes.
image = { workspace = true, features = ["pnm"] }

[dev-dependencies]
spiral-robotics-common = { workspace = true, features = ["test-support"] }
spiral-robotics-storage = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { version = "1", features = ["test-util", "process", "io-util"] }
