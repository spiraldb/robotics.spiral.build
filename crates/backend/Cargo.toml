[package]
name = "spiral-robotics-backend"
version.workspace = true
edition.workspace = true
description = "Server runtime for Spiral Robotics Studio"
publish = false

[lints]
workspace = true

[dependencies]
spiral-robotics-common.workspace = true
spiral-robotics-hardware.workspace = true
spiral-robotics-storage.workspace = true
spiral-robotics-training.workspace = true
clap.workspace = true
dioxus = { workspace = true, features = ["cli-config", "server"] }
serde.workspace = true
serde_json.workspace = true
serialport.workspace = true
axum = { version = "0.8", features = ["macros"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
arrow-ipc = { version = "58.4.0", features = ["zstd"] }
arrow-json = "58.4.0"
arrow-select = "58.4.0"
base64.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
safetensors = "0.7"
sha2 = "0.10"
image.workspace = true
hf-hub.workspace = true
spiral-robotics-inference.workspace = true
dirs = "6"
tokenizers.workspace = true
tempfile.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
spiral-robotics-common = { workspace = true, features = ["test-support"] }
spiral-robotics-inference = { workspace = true, features = ["test-support"] }
spiral-robotics-storage = { workspace = true, features = ["test-support"] }
spiral-robotics-training = { workspace = true, features = ["test-support"] }
