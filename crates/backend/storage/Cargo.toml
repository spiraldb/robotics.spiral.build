[package]
name = "spiral-robotics-storage"
version.workspace = true
edition.workspace = true
description = "SpiralDB storage, schemas, queries, ingestion, and project transfer"
publish = false

[lints]
workspace = true

[features]
test-support = []

[dependencies]
spiral-robotics-common.workspace = true
spiral-robotics-hardware.workspace = true
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
arrow-ipc = { version = "58.4.0", features = ["zstd"] }
arrow-json = "58.4.0"
base64.workspace = true
dirs = "6"
futures = { version = "0.3", default-features = false, features = ["std"] }
image.workspace = true
parking_lot = "0.12"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
spiral-client.workspace = true
spiral-config.workspace = true
spiral-defaults.workspace = true
spiral-engine.workspace = true
spiral-session.workspace = true
spiraldb-catalog.workspace = true
spiraldb-control-plane.workspace = true
spiraldb-table.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tracing = "0.1"
url = "2"
vortex-array.workspace = true
vortex-arrow.workspace = true
vortex-error.workspace = true

[dev-dependencies]
spiral-robotics-common = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[build-dependencies]
serde_json.workspace = true
