[package]
name = "spiral-robotics-storage"
version.workspace = true
edition.workspace = true
description = "SpiralDB storage, schemas, queries, ingestion, and project transfer"
publish.workspace = true

[lints]
workspace = true

[features]
test-support = ["spiral-robotics-recording/test-support"]

[dependencies]
adbc_core.workspace = true
adbc_driver_manager.workspace = true
arrow-buffer = "58.4.0"
arrow-data = "58.4.0"
spiral-robotics-common.workspace = true
# Splits the H.264 FFmpeg encodes into access units, as the robot connector does.
spiral-robotics-recording.workspace = true
arrow-array = "58.4.0"
arrow-schema = { version = "58.4.0", features = ["canonical_extension_types"] }
arrow-ipc = { version = "58.4.0", features = ["zstd"] }
arrow-json = "58.4.0"
arrow-cast = "58.4.0"
arrow-select = "58.4.0"
base64.workspace = true
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
image.workspace = true
# Reads LeRobot's frame and metadata tables.
parquet = "58.4.0"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
sea-orm = { version = "=1.1.20", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json"] }
sea-orm-migration = { version = "=1.1.20", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "process", "fs", "io-util"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
tempfile.workspace = true
mcap = "0.25"
prost = "0.14"
prost-reflect = "0.16"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
futures = { version = "0.3", features = ["async-await"] }
tokio = { version = "1", features = ["macros", "time"] }
spiral-robotics-common = { workspace = true, features = ["test-support"] }
spiral-robotics-recording = { workspace = true, features = ["test-support"] }

[build-dependencies]
serde_json.workspace = true
