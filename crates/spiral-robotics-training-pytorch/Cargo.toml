[package]
name = "spiral-robotics-training-pytorch"
version.workspace = true
edition.workspace = true
description = "PyTorch implementation of the Spiral Robotics training boundary"
publish = false

[dependencies]
spiral-robotics-inference-pytorch = { workspace = true, features = ["download"] }
spiral-robotics-training.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
spiral-robotics-inference-pytorch = { workspace = true, features = ["metal"] }
mach2 = "0.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
