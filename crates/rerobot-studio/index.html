        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">

    <body>
        <!--
        THESIS: The studio exposes one literal loop — Record, select an episode,
        Replay, Export — and refuses diagnostic or judgement lanes as primary UI.
        The one measurement it draws rather than prints is a take's own shape,
        bound to the take and to nothing else.
        OWN-WORLD: One light neutral workspace, a pale WebGL bench, white
        surfaces, graphite ink, role blue, small radii, hairline separators, and
        monospace only for changing or recorded values. Six fixed joint hues,
        spent on traces and their keys, are the only colour outside it.
        STORY: Connect the arms, teleoperate, record episodes, watch the joints
        trace as they are captured, select one, replay it on a compatible arm,
        and export the completed session.
        FIRST VIEWPORT: The header and three-pane shell remain primary. A compact
        dataset toolbar carries Record, elapsed time, session count, and Export;
        an episode strip and one selected-episode row carry Replay and details.
        The Robots column stacks Signals under the arm list: one plot per arm on
        one time axis, over a readout of joints down and arms across.
        FORM: Simplified take-table and scrubber, approved with an episode strip
        replacing the table; seed 633a58ad. Signals is code-led: stacked small
        multiples with a shared zoom, and a readout that is legend, value table,
        and joint switchboard at once.
        FINISH: unreviewed and undocumented is unfinished; this build ends with
        the finish review, the verdict, and DESIGN.md
        -->
        <div id="main"></div>
    </body>
</html>
