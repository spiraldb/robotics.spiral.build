[package]
name = "rerobot-studio"
version.workspace = true
edition.workspace = true
description = "Web studio for setting up, calibrating, and operating SO-ARM101 arms"
publish = false

[features]
default = []
web = ["dioxus/web"]
server = [
    "dioxus/cli-config",
    "dioxus/server",
    "dep:rerobot",
    "dep:clap",
    "dep:axum",
    "dep:bytes",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:async-stream",
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:parquet",
    "dep:zip",
]

[dependencies]
rerobot = { workspace = true, optional = true }
rerobot-core.workspace = true
clap = { workspace = true, optional = true }
dioxus = { workspace = true, features = [
    "asset",
    "document",
    "fullstack",
    "hooks",
    "html",
    "launch",
    "logger",
    "macro",
    "signals",
] }
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["macros"], optional = true }
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gloo-net = { version = "0.7", default-features = false, features = ["eventsource", "http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "=0.2.126"
web-sys = { version = "0.3", features = [
    "Document",
    "DomRect",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "PointerEvent",
    "Storage",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "Window",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "time"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
tower-http = { version = "0.7", features = ["set-header", "trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
async-stream = { version = "0.3", optional = true }
arrow-array = { version = "58.4.0", optional = true }
arrow-schema = { version = "58.4.0", optional = true }
parquet = { version = "58.4.0", default-features = false, features = ["arrow", "snap"], optional = true }
zip = { version = "2.4.2", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "rerobot-studio"
path = "src/main.rs"
