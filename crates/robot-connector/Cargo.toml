[package]
name = "spiral-robotics-robot-connector"
version.workspace = true
edition.workspace = true
description = "HTTP endpoint that runs next to robot arms: hardware, recording, and policy rollout"
publish.workspace = true

[lints]
workspace = true

[dependencies]
arrow-array = "58.4.0"
arrow-ipc = { version = "58.4.0", features = ["zstd"] }
arrow-schema = "58.4.0"
axum = "0.8"
base64.workspace = true
bytes = "1"
clap.workspace = true
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
image.workspace = true
pollster = "0.4"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
safetensors = "0.7"
serde.workspace = true
serde_json.workspace = true
serialport.workspace = true
spiral-robotics-common.workspace = true
spiral-robotics-hardware.workspace = true
spiral-robotics-inference.workspace = true
spiral-robotics-recording.workspace = true
spiral-robotics-viewport.workspace = true
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["cors", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
spiral-robotics-common = { workspace = true, features = ["test-support"] }
spiral-robotics-recording = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { version = "1", features = ["test-util"] }
