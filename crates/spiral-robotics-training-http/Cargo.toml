[package]
name = "spiral-robotics-training-http"
version.workspace = true
edition.workspace = true
description = "HTTP and Arrow IPC transport for Spiral Robotics policy compute runtimes"
publish = false

[dependencies]
spiral-robotics-inference.workspace = true
spiral-robotics-training.workspace = true
arrow-array = "58.4.0"
arrow-ipc = "58.4.0"
arrow-schema = "58.4.0"
axum = { version = "0.8", features = ["json"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json"] }
serde.workspace = true
tokio = { version = "1", features = ["net", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
