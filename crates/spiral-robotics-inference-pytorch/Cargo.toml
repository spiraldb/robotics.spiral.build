[package]
name = "spiral-robotics-inference-pytorch"
version.workspace = true
edition.workspace = true
description = "PyTorch ACT training and inference implementation"
publish = false

[features]
default = ["cli"]
accelerate = []
metal = []
download = ["spiral-robotics-inference/download", "dep:dirs"]
cli = ["dep:clap", "dep:image", "download"]

[dependencies]
spiral-robotics-inference.workspace = true
clap = { workspace = true, features = ["derive"], optional = true }
dirs = { version = "6", optional = true }
image = { workspace = true, optional = true }
safetensors = "0.7"
serde.workspace = true
serde_json.workspace = true
tch = { version = "0.22.0", features = ["download-libtorch"] }
torch-sys = "0.22.0"

[dev-dependencies]
sha2 = "0.10"

[[bin]]
name = "spiral-robotics-infer"
path = "src/bin/infer.rs"
required-features = ["cli"]
