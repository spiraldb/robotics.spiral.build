[package]
name = "spiral-robotics-desktop"
version.workspace = true
edition.workspace = true
description = "Spiral Robotics Studio as a desktop app"
publish = false

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = ["config-toml"] }

[dependencies]
spiral-robotics-backend = { path = "../backend" }
tauri = { version = "2.12", features = ["config-toml"] }
tauri-plugin-single-instance = "2.5"
