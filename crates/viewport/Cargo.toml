[package]
name = "spiral-robotics-viewport"
version.workspace = true
edition.workspace = true
description = "The studio's 3D bench: a scene of addressable, pickable entities, drawn with wgpu in the browser and off screen"
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
bytemuck = "1"
glam.workspace = true
mesh-loader = "0.1.13"
roxmltree.workspace = true
web-sys = { version = "0.3", features = ["DomRect", "Element", "HtmlCanvasElement"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["webgl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["gles", "metal", "vulkan"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "0.4"
