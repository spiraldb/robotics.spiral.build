[package]
name = "spiral-robotics-ui"
version.workspace = true
edition.workspace = true
description = "Shared interaction language for Spiral Robotics interfaces"
publish = false

[features]
default = []
web = ["dep:wasm-bindgen", "dep:web-sys"]

[dependencies]
dioxus = { workspace = true, features = [
    "asset",
    "document",
    "hooks",
    "html",
    "macro",
    "signals",
] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = { version = "=0.2.126", optional = true }
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "NodeList",
    "Window",
], optional = true }
