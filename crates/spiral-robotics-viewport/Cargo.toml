[package]
name = "spiral-robotics-viewport"
version.workspace = true
edition.workspace = true
description = "The studio's 3D bench: a WebGL scene of addressable, pickable entities"
publish = false

[dependencies]
spiral-robotics-core.workspace = true
js-sys = "0.3"
wasm-bindgen = "=0.2.126"
web-sys = { version = "0.3", features = [
    "Document",
    "DomRect",
    "Element",
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "Window",
] }
