[package]
name = "spiral-robotics-viewport"
version.workspace = true
edition.workspace = true
description = "The studio's 3D bench: a WebGL scene of addressable, pickable entities"
publish = false

[lints]
workspace = true

[features]
test-support = []

[dependencies]
glam.workspace = true
js-sys = "0.3"
roxmltree.workspace = true
wasm-bindgen = "=0.2.126"
web-sys = { version = "0.3", features = [
    "DomRect",
    "Element",
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
] }
