[workspace]
resolver = "3"
members = [
    "crates/spiral-robotics-api",
    "crates/spiral-robotics-hardware",
    "crates/spiral-robotics-storage",
    "crates/spiral-robotics-inference",
    "crates/spiral-robotics-training",
    "crates/spiral-robotics-backend",
    "crates/spiral-robotics-viewport",
    "crates/spiral-robotics-frontend",
    "crates/spiral-robotics-studio",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
dead_code = "deny"
unreachable_pub = "deny"

[workspace.dependencies]
base64 = "0.22"
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
candle-transformers = "=0.11.0"
spiral-robotics-api = { path = "crates/spiral-robotics-api" }
spiral-robotics-inference = { path = "crates/spiral-robotics-inference", default-features = false }
spiral-robotics-hardware = { path = "crates/spiral-robotics-hardware" }
spiral-robotics-backend = { path = "crates/spiral-robotics-backend" }
spiral-robotics-frontend = { path = "crates/spiral-robotics-frontend" }
spiral-robotics-storage = { path = "crates/spiral-robotics-storage" }
spiral-robotics-training = { path = "crates/spiral-robotics-training" }
spiral-robotics-viewport = { path = "crates/spiral-robotics-viewport" }
spiral-client = { git = "https://github.com/spiraldb/spiraldb.git", branch = "develop" }
spiral-config = { git = "https://github.com/spiraldb/spiraldb.git", branch = "develop" }
spiral-defaults = { git = "https://github.com/spiraldb/spiraldb.git", branch = "develop" }
spiral-engine = { git = "https://github.com/spiraldb/spiraldb.git", branch = "develop" }
spiral-session = { git = "https://github.com/spiraldb/spiraldb.git", branch = "develop" }
spiraldb-catalog = { git = "https://github.com/spiraldb/spiraldb.git", branch = "develop" }
spiraldb-control-plane = { git = "https://github.com/spiraldb/spiraldb.git", branch = "develop" }
spiraldb-table = { git = "https://github.com/spiraldb/spiraldb.git", branch = "develop" }
vortex-array = { git = "https://github.com/vortex-data/vortex.git", rev = "ee1ac2521bb477d26797b300c8d0fdd17101fb0c" }
vortex-arrow = { git = "https://github.com/vortex-data/vortex.git", rev = "ee1ac2521bb477d26797b300c8d0fdd17101fb0c" }
vortex-error = { git = "https://github.com/vortex-data/vortex.git", rev = "ee1ac2521bb477d26797b300c8d0fdd17101fb0c" }
clap = { version = "4.5", features = ["derive"] }
dioxus = { version = "0.7.10", default-features = false }
dioxus-flow = { git = "https://github.com/XiangpengHao/dioxus-flow", rev = "a85262445c1707a397511d63a049e3c6d59ab927" }
dioxus-workbench = { git = "https://github.com/XiangpengHao/dioxus-workbench", rev = "a6d65f06d272ac3efa6cc9f1f22e60bb733855b7" }
glam = { version = "0.33", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
hf-hub = { version = "=0.4.3", default-features = false, features = ["ureq", "native-tls"] }
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-native", "serialize"] }
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.9", default-features = false }
tempfile = "3.27"
tokenizers = "=0.22.2"

[profile.dev]
# The Studio's native half is large enough that full DWARF dominates compile,
# link, and artifact I/O during edit/serve cycles. Browser artifacts already
# omit DWARF below; keep both halves aligned for the latency-focused dev build.
debug = 0

[profile.wasm-dev]
inherits = "dev"
# Dioxus 0.7 asks wasm-bindgen and Binaryen to preserve debug information even
# when Binaryen cannot parse the DWARF emitted by newer Rust toolchains. Do not
# emit DWARF for browser artifacts either.
debug = 0

[profile.wasm-release]
inherits = "release"
# DX uses this profile only for the downloaded WebAssembly half of the studio.
opt-level = "s"
# `dx serve --release` is still optimized, but favor parallel and incremental
# code generation over whole-program optimization for edit/serve latency.
lto = false
codegen-units = 256
incremental = true
panic = "abort"
debug = 0

[profile.server-release]
inherits = "release"
# Dioxus reserves this profile for the native fullstack server. Preserve
# release optimization while making warm release rebuilds incremental. Keep
# the release default unit count: the server's broad dependency graph already
# supplies cold-build parallelism, and 256 units only adds link/I/O pressure.
codegen-units = 16
incremental = true
