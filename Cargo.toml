dioxus-config-macros       = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
dioxus-core                = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
dioxus-core-macro          = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
dioxus-core-types          = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
dioxus-devtools            = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
dioxus-devtools-types      = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
dioxus-document            = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
dioxus-fullstack           = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
dioxus-fullstack-core      = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
dioxus-fullstack-macro     = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
dioxus-history             = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
