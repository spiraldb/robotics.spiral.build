[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/backend/storage",
    "crates/backend",
    "robot-connector/hardware",
    "robot-connector/recording",
    "robot-connector",
    "robot-connector/drivers/os",
    "crates/viewport",
    "crates/frontend",
    "crates/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# spiraldb's prebuilt ScanDAL archive for each target, from its
# native-runtime workflow at the commit the SDK is pinned to, copied to a
# pre-release of this repository that CI reads with its own token:
# scripts/setup-scandal-runtime.py installs it where spiral-scandal-sys links it,
# and mirrors the pinned archives after re-pinning.
[workspace.metadata.scandal-runtime]
repository = "spiraldb/spiraldb"
source = "93e2113174cb6203194ebfcb1c2cd03df1f3dca8"
mirror = "spiraldb/spiral-robotics"
release = "scandal-runtime-93e21131"

[workspace.metadata.scandal-runtime.archives.x86_64-unknown-linux-gnu]
artifact-id = "12068964589"
sha256 = "40a600ca268781540df0a9cf80d365c3118be9fdeec33c9ecbc273863f0d4510"

[workspace.metadata.scandal-runtime.archives.aarch64-unknown-linux-gnu]
artifact-id = "12069193608"
sha256 = "37b4a3f14d5e3deadc92f8211e85bdbbd3292f0a50bff3eb1a774bff09ef582d"

[workspace.metadata.scandal-runtime.archives.aarch64-apple-darwin]
artifact-id = "12070031263"
sha256 = "f8097c63d8201419f40e2187ec68dce5d0cb73d9907b93ef08d2dcad215b66d2"

[workspace.lints.rust]
dead_code = "deny"
unreachable_pub = "deny"

[workspace.dependencies]
# Spiral's SDK and its DataFusion integration, from the private SpiralDB
# repository at one develop commit; the ScanDAL runtime the SDK links is the
# archive `workspace.metadata.scandal-runtime` pins for the same commit.
spiral-sdk = { git = "https://github.com/spiraldb/spiraldb.git", rev = "93e2113174cb6203194ebfcb1c2cd03df1f3dca8", default-features = false, features = ["embedded"] }
spiral-datafusion = { git = "https://github.com/spiraldb/spiraldb.git", rev = "93e2113174cb6203194ebfcb1c2cd03df1f3dca8", features = ["sql"] }
datafusion = { version = "55", default-features = false }
base64 = "0.22"
spiral-robotics-common = { path = "crates/common" }
spiral-robotics-connector = { path = "robot-connector" }
spiral-robotics-hardware = { path = "robot-connector/hardware" }
spiral-robotics-recording = { path = "robot-connector/recording" }
spiral-robotics-storage = { path = "crates/backend/storage" }
spiral-robotics-ui = { path = "crates/ui" }
spiral-robotics-viewport = { path = "crates/viewport" }
clap = { version = "4.5", features = ["derive", "env"] }
dioxus = { version = "0.7.10", default-features = false }
dioxus-flow = "0.1.3"
dioxus-workbench = "0.1.2"
glam = { version = "0.33", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-native", "serialize"] }
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.9", default-features = false }
tempfile = "3.27"

[profile.dev]
# The Studio's native half is large enough that full DWARF dominates compile,
# link, and artifact I/O during edit/serve cycles. Browser artifacts already
# omit DWARF below; keep both halves aligned for the latency-focused dev build.
debug = 0

[profile.wasm-dev]
inherits = "dev"
# Dioxus 0.7 asks wasm-bindgen and Binaryen to preserve debug information even
# when Binaryen cannot parse the DWARF emitted by newer Rust toolchains. Do not
# emit DWARF for browser artifacts either.
debug = 0

[profile.wasm-release]
inherits = "release"
# DX uses this profile only for the downloaded WebAssembly half of the studio.
opt-level = "s"
# `dx serve --release` is still optimized, but favor parallel and incremental
# code generation over whole-program optimization for edit/serve latency.
lto = false
codegen-units = 256
incremental = true
panic = "abort"
debug = 0

[profile.server-release]
inherits = "release"
incremental = true

# Dioxus 0.7.10 plus DioxusLabs/dioxus#5894, until a release ships it: an
# optional event handler that a re-render adds to a mounted component is
# no longer freed. Every crate of the Dioxus repository comes from the one
# branch, since its crates depend on each other by path.
[patch.crates-io]
dioxus                     = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
dioxus-asset-resolver      = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
dioxus-cli-config          = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
