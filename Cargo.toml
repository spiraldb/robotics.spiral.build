[workspace]
resolver = "3"
members = [
    "crates/spiral-robotics",
    "crates/spiral-robotics-boundary-build",
    "crates/spiral-robotics-contracts",
    "crates/spiral-robotics-core",
    "crates/spiral-robotics-inference",
    "crates/spiral-robotics-ui",
    "crates/spiral-robotics-studio",
    "crates/spiral-robotics-studio-application",
    "crates/spiral-robotics-studio-backend",
    "crates/spiral-robotics-studio-hardware",
    "crates/spiral-robotics-training",
    "crates/spiral-robotics-training-http",
    "crates/spiral-robotics-viewport",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
adbc-driver-spiraldb = { git = "https://github.com/spiraldb/spiraldb.git", branch = "develop", default-features = false }
base64 = "0.22"
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
candle-transformers = "=0.11.0"
spiral-robotics = { path = "crates/spiral-robotics" }
spiral-robotics-boundary-build = { path = "crates/spiral-robotics-boundary-build" }
spiral-robotics-contracts = { path = "crates/spiral-robotics-contracts" }
spiral-robotics-core = { path = "crates/spiral-robotics-core" }
spiral-robotics-inference = { path = "crates/spiral-robotics-inference", default-features = false }
spiral-robotics-ui = { path = "crates/spiral-robotics-ui" }
spiral-robotics-studio-backend = { path = "crates/spiral-robotics-studio-backend" }
spiral-robotics-studio-hardware = { path = "crates/spiral-robotics-studio-hardware" }
spiral-robotics-studio-application = { path = "crates/spiral-robotics-studio-application" }
spiral-robotics-training = { path = "crates/spiral-robotics-training" }
spiral-robotics-training-http = { path = "crates/spiral-robotics-training-http" }
spiral-robotics-viewport = { path = "crates/spiral-robotics-viewport" }
clap = { version = "4.5", features = ["derive"] }
dioxus = { version = "0.7.10", default-features = false }
dioxus-flow = { git = "https://github.com/XiangpengHao/dioxus-flow", rev = "a85262445c1707a397511d63a049e3c6d59ab927" }
dioxus-workbench = { git = "https://github.com/XiangpengHao/dioxus-workbench", rev = "a6d65f06d272ac3efa6cc9f1f22e60bb733855b7" }
glam = { version = "0.33", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
hf-hub = { version = "=0.4.3", default-features = false, features = ["ureq", "native-tls"] }
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-native", "serialize"] }
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.9", default-features = false }
tempfile = "3.27"
tokenizers = "=0.22.2"

[profile.dev]
# The Studio's native half is large enough that full DWARF dominates compile,
# link, and artifact I/O during edit/serve cycles. Browser artifacts already
# omit DWARF below; keep both halves aligned for the latency-focused dev build.
debug = 0

[profile.wasm-dev]
inherits = "dev"
# Dioxus 0.7 asks wasm-bindgen and Binaryen to preserve debug information even
# when Binaryen cannot parse the DWARF emitted by newer Rust toolchains. Do not
# emit DWARF for browser artifacts either.
debug = 0

[profile.wasm-release]
inherits = "release"
# DX uses this profile only for the downloaded WebAssembly half of the studio.
opt-level = "s"
# `dx serve --release` is still optimized, but favor parallel and incremental
# code generation over whole-program optimization for edit/serve latency.
lto = false
codegen-units = 256
incremental = true
panic = "abort"
debug = 0

[profile.server-release]
inherits = "release"
# Dioxus reserves this profile for the native fullstack server. Preserve
# release optimization while making warm release rebuilds incremental. Keep
# the release default unit count: the server's broad dependency graph already
# supplies cold-build parallelism, and 256 units only adds link/I/O pressure.
codegen-units = 16
incremental = true
