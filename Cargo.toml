[workspace]
members = ["crates/rerobot-core", "crates/rerobot-studio"]
# The web UI only compiles for wasm32, so it keeps its own lockfile and is built
# by the Dioxus CLI rather than by a host `cargo build`.
exclude = ["crates/rerobot-ui", "patches/block"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
rerobot = { path = "." }
rerobot-core = { path = "crates/rerobot-core" }
clap = { version = "4.5", features = ["derive"] }
glam = { version = "0.33", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-native", "serialize"] }
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.9", default-features = false }
tempfile = "3.27"

[package]
name = "rerobot"
version.workspace = true
edition.workspace = true
description = "Rust-native tools for real-world robotics"
publish = false

[dependencies]
rerobot-core.workspace = true
clap.workspace = true
image.workspace = true
nokhwa.workspace = true
serde.workspace = true
serde_json.workspace = true
serialport.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[patch.crates-io]
block = { path = "patches/block" }

[[bin]]
name = "rerobot-find-port"
path = "src/bin/find_port.rs"

[[bin]]
name = "rerobot-find-cameras"
path = "src/bin/find_cameras.rs"

[[bin]]
name = "rerobot-calibrate"
path = "src/bin/calibrate.rs"
