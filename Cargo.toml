dioxus-interpreter-js      = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
dioxus-logger              = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
dioxus-router              = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
dioxus-router-macro        = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
dioxus-rsx                 = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
dioxus-signals             = { git = "https://github.com/XiangpengHao/dioxus", branch = "fix-optional-callback-owner-0.7" }
