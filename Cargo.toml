[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/backend/storage",
    "crates/backend/training",
    "crates/backend",
    "crates/robot-connector/hardware",
    "crates/robot-connector/inference",
    "crates/robot-connector/recording",
    "crates/robot-connector",
    "crates/viewport",
    "crates/frontend",
    "crates/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
dead_code = "deny"
unreachable_pub = "deny"

[workspace.dependencies]
adbc_core = "0.24.0"
adbc_driver_manager = "0.24.0"
base64 = "0.22"
spiral-robotics-common = { path = "crates/common" }
spiral-robotics-inference = { path = "crates/robot-connector/inference" }
spiral-robotics-hardware = { path = "crates/robot-connector/hardware" }
spiral-robotics-recording = { path = "crates/robot-connector/recording" }
spiral-robotics-storage = { path = "crates/backend/storage" }
spiral-robotics-training = { path = "crates/backend/training" }
spiral-robotics-ui = { path = "crates/ui" }
spiral-robotics-viewport = { path = "crates/viewport" }
clap = { version = "4.5", features = ["derive", "env"] }
dioxus = { version = "0.7.10", default-features = false }
dioxus-flow = "0.1.3"
dioxus-workbench = "0.1.2"
glam = { version = "0.33", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-native", "serialize"] }
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.9", default-features = false }
tempfile = "3.27"

[profile.dev]
# The Studio's native half is large enough that full DWARF dominates compile,
# link, and artifact I/O during edit/serve cycles. Browser artifacts already
# omit DWARF below; keep both halves aligned for the latency-focused dev build.
debug = 0

[profile.wasm-dev]
inherits = "dev"
# Dioxus 0.7 asks wasm-bindgen and Binaryen to preserve debug information even
# when Binaryen cannot parse the DWARF emitted by newer Rust toolchains. Do not
# emit DWARF for browser artifacts either.
debug = 0

[profile.wasm-release]
inherits = "release"
# DX uses this profile only for the downloaded WebAssembly half of the studio.
opt-level = "s"
# `dx serve --release` is still optimized, but favor parallel and incremental
# code generation over whole-program optimization for edit/serve latency.
lto = false
codegen-units = 256
incremental = true
panic = "abort"
debug = 0

[profile.server-release]
inherits = "release"
incremental = true
