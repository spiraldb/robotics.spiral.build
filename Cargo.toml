[package]
name = "rerobot"
version = "0.1.0"
edition = "2024"
description = "Rust-native tools for real-world robotics"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-native", "serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.9", default-features = false }
tempfile = "3.27"

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[patch.crates-io]
block = { path = "patches/block" }

[[bin]]
name = "rerobot-find-port"
path = "src/bin/find_port.rs"

[[bin]]
name = "rerobot-find-cameras"
path = "src/bin/find_cameras.rs"
