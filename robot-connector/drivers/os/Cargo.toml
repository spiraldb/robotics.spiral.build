[package]
name = "spiral-robotics-connector-os"
version.workspace = true
edition.workspace = true
description = "The robot connector on an operating system (Mac, Linux, Raspberry Pi), with its device drivers"
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
clap.workspace = true
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
image.workspace = true
nokhwa.workspace = true
serde.workspace = true
serde_json.workspace = true
serialport.workspace = true
spiral-robotics-common.workspace = true
spiral-robotics-connector.workspace = true
spiral-robotics-hardware.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"

[dev-dependencies]
spiral-robotics-recording.workspace = true
