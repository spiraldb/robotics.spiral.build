# Studio behind a Cloudflare Tunnel on one VM. Nothing listens on the VM's
# network: cloudflared reaches Studio at http://studio:8080 on this project's
# network, and Cloudflare Access gates the public hostname.
#
# Put the tunnel's token in a `.env` file beside this one:
#   TUNNEL_TOKEN=<token from the Cloudflare dashboard>

services:
  studio:
    image: ghcr.io/spiraldb/spiral-robotics-studio:latest
    restart: unless-stopped
    volumes:
      - studio-state:/var/lib/spiral-robotics

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - studio

volumes:
  # Studio's SQLite state and its Spiral sign-in.
  studio-state:
