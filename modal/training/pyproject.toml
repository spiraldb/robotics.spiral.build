[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "spiral-training-runtime"
version = "0.1.0"
description = "ACT and progress-model training on Modal for Spiral Robotics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "av>=19,<20",
    "fastapi>=0.116,<1",
    "lerobot==0.6.0",
    "numpy>=2.0,<2.3",
    "nvidia-ml-py>=12,<14; sys_platform == 'linux'",
    "psutil>=7,<8",
    "pyarrow>=21,<30",
    "pydantic>=2,<3",
    "safetensors>=0.4.3,<1",
    "torch>=2.7,<2.8",
    "torchvision>=0.22,<0.23",
    "triton==3.3.1; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13,<3",
    "modal>=1.6,<2",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spiral_training_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Upstream's code, kept byte for byte.
extend-exclude = ["src/spiral_training_runtime/warp_rm_upstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
triton = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
