[project]
name = "object-tracking"
version = "0.1.0"
description = "SAM 3.1 object tracks for one episode's camera video, served on Modal."
requires-python = "==3.12.*"
dependencies = [
    "av==19.0.0",
    "fastapi==0.142.1",
    "huggingface-hub==1.33.0",
    # SAM 3 pins NumPy below 2.
    "numpy>=1.26,<2",
    "pillow>=13,<14",
    "pyarrow==25.0.1",
    # SAM 3.1 (5a3143c) with importlib.resources replacing pkg_resources.
    # Later upstream commits break SAM 3.1 video sessions.
    "sam3 @ git+https://github.com/robert3005/sam3.git@1dfdd40d698df88b41b0731daf8a4c94edda7c17",
    # What SAM 3 imports beyond its declared dependencies.
    "einops>=0.8,<1",
    "matplotlib>=3.9,<4",
    "opencv-python-headless>=4.10,<5",
    "pandas>=2.2,<3",
    "psutil>=6,<8",
    "pycocotools>=2.0.8,<3",
    "scikit-image>=0.24,<1",
    "scipy>=1.14,<2",
    "setuptools>=84.1,<85",
    "torch==2.14.0",
    "torchvision==0.29.2",
    "video-service",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "modal==1.6.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
# Shared with the other video services. Editable, so a deploy copies the source as it is.
video-service = { path = "../video_service", editable = true }
