name: Desktop release

# Every push to main releases the macOS app, with a Spiral driver built from
# the SpiralDB branch below.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer main supersedes a release that is still building.
concurrency:
  group: desktop-release
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The SpiralDB branch whose driver the app ships. Each release builds its
  # head and names that commit in the release notes.
  SPIRALDB_REF: xiangpeng/curation-functions
  TARGET: aarch64-apple-darwin

jobs:
  driver:
    name: Spiral driver
    runs-on: macos-15
    timeout-minutes: 180
    outputs:
      commit: ${{ steps.spiraldb.outputs.commit }}
    steps:
      # SpiralDB is private: a read-only deploy key on spiraldb/spiraldb lets
      # this repository check it out. Its CI actions expect the checkout at the
      # workspace root, as in SpiralDB's own driver build.
      - name: Check out SpiralDB
        uses: actions/checkout@v6
        with:
          repository: spiraldb/spiraldb
          ref: ${{ env.SPIRALDB_REF }}
          ssh-key: ${{ secrets.SPIRALDB_DEPLOY_KEY }}
          persist-credentials: false

      - id: spiraldb
        name: Name the SpiralDB commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: cache
        name: Reuse the driver built from this commit
        uses: actions/cache@v4
        with:
          path: spiral-driver
          key: spiral-driver-${{ env.TARGET }}-${{ steps.spiraldb.outputs.commit }}

      # The same toolchain SpiralDB builds its published driver with.
      - name: Install schema compilers
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-protoc
        with:
          version: "26.1"

      - name: Install native build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install autoconf automake libtool openssl@3 pkgconf

      - name: Set up Rust
        if: steps.cache.outputs.cache-hit != 'true'
        uses: spiraldb/actions/.github/actions/setup-rust@a746510eafaa926484c354541cfc49b2ec06cc63 # 0.18.6
        with:
          shared_key: desktop-driver-${{ env.TARGET }}
          targets: ${{ env.TARGET }}

      - name: Set up LGPL-only FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-ffmpeg-lgpl

      # Static OpenSSL, as in SpiralDB's own app, so the driver loads nothing
      # from Homebrew.
      - name: Build the driver
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          OPENSSL_DIR="$(brew --prefix openssl@3)" OPENSSL_STATIC=1 \
            cargo build --locked --release --package adbc-driver-spiraldb --target "$TARGET"

      # The driver loads its video runtime from its own directory, and the
      # runtime loads FFmpeg through @rpath: stage the LGPL libraries it names,
      # and the ones they name, beside it, and resolve @rpath there.
      - name: Stage the driver with its video runtime
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p spiral-driver
          cp "target/$TARGET/release/libadbc_driver_spiraldb.dylib" spiral-driver/
          runtime=$(find target -path '*/artifact/cdylib/libspiral_video_runtime.dylib' -exec ls -t {} + | head -n 1)
          test -n "$runtime"
          cp "$runtime" spiral-driver/
          staged() { ls spiral-driver/libspiral_video_runtime.dylib spiral-driver/libav*.dylib spiral-driver/libsw*.dylib 2>/dev/null; }
          changed=1
          while [ "$changed" = 1 ]; do
            changed=0
            for file in $(staged); do
              for name in $(otool -L "$file" | awk 'NR > 2 && $1 ~ /^@rpath\// { sub(/^@rpath\//, "", $1); print $1 }'); do
                if [ ! -e "spiral-driver/$name" ]; then
                  cp -L "$FFMPEG_DIR/lib/$name" "spiral-driver/$name"
                  changed=1
                fi
              done
            done
          done
          for file in $(staged); do
            otool -l "$file" | grep -q 'path @loader_path ' || install_name_tool -add_rpath @loader_path "$file"
          done
          ls -l spiral-driver

      - name: Check the driver is self-contained
        run: |
          set -euo pipefail
          for file in spiral-driver/*.dylib; do
            if otool -L "$file" | sed 1,2d | grep -E '/opt/homebrew|/usr/local|/Users/'; then
              echo "::error::$file loads a library from outside the app"
              exit 1
            fi
          done
          # Loading resolves every dependency without the build's library paths.
          for file in spiral-driver/libadbc_driver_spiraldb.dylib spiral-driver/libspiral_video_runtime.dylib; do
            env -u DYLD_LIBRARY_PATH python3 -c 'import ctypes, sys; ctypes.CDLL(sys.argv[1])' "$file"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: spiral-driver
          path: spiral-driver
          if-no-files-found: error

  app:
    name: Desktop app
    needs: driver
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: spiral-driver
          path: crates/desktop/spiral-driver

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/desktop"

      # The workflow's driver replaces the local one Tauri.toml names. The app
      # is ad-hoc signed until this repository has Developer ID secrets, and
      # the hardened runtime, which only notarization needs, stays off.
      - name: Build the app
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/desktop
        run: |
          set -euo pipefail
          cd crates/desktop
          frameworks=$(jq -nc '$ARGS.positional' --args spiral-driver/*.dylib)
          config=$(jq -nc --arg version "$VERSION" --argjson frameworks "$frameworks" \
            '{version: $version, bundle: {macOS: {frameworks: $frameworks, signingIdentity: "-", hardenedRuntime: false}}}')
          nix develop ../..#desktop --command cargo tauri build --bundles app,dmg --config "$config"

      - name: Check the bundle
        run: |
          set -euo pipefail
          app="target/desktop/release/bundle/macos/Spiral Robotics Studio.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          test -f "$app/Contents/Frameworks/libadbc_driver_spiraldb.dylib"
          test -f "$app/Contents/Frameworks/libspiral_video_runtime.dylib"
          test -f "$app/Contents/Resources/public/index.html"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SPIRALDB_COMMIT: ${{ needs.driver.outputs.commit }}
        run: |
          set -euo pipefail
          cp target/desktop/release/bundle/dmg/*.dmg "spiral-robotics-studio-$VERSION.dmg"
          notes=$(cat <<EOF
          Built from spiral-robotics $GITHUB_SHA and SpiralDB \`$SPIRALDB_REF\` at spiraldb/spiraldb@$SPIRALDB_COMMIT.

          The app is ad-hoc signed. After copying it to Applications, open it once from Finder with right-click → Open, or run \`xattr -dr com.apple.quarantine "/Applications/Spiral Robotics Studio.app"\`. Recording camera video needs \`ffmpeg\`, which the app cannot find yet when it is opened from Finder.
          EOF
          )
          gh release create "desktop-v$VERSION" "spiral-robotics-studio-$VERSION.dmg" \
            --target "$GITHUB_SHA" \
            --title "Spiral Robotics Studio $VERSION" \
            --notes "$notes"
