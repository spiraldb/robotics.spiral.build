name: Hosted image

# Every push to main publishes the hosted Studio image (deploy/hosted), with a
# Spiral driver built from the SpiralDB branch below.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer main supersedes an image that is still building.
concurrency:
  group: hosted-image
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The SpiralDB branch whose driver the image ships.
  SPIRALDB_REF: develop
  IMAGE: ghcr.io/spiraldb/spiral-robotics-studio

jobs:
  # The web interface builds on its own runner: the Nix toolchain and the
  # image's Rust builds do not fit on one runner's disk together.
  web:
    name: Web interface
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/hosted"

      # dx keeps earlier builds' hashed assets, so the bundle and dx's copy of
      # it start empty.
      - name: Build the web interface
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/hosted
        run: |
          set -euo pipefail
          rm -rf target/hosted/web target/hosted/dx/spiral-robotics-frontend/release/web/public
          nix develop .#web --command dx bundle --web --release --debug-symbols false \
            --package spiral-robotics-frontend --out-dir target/hosted/web
          test -f target/hosted/web/public/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: target/hosted/web/public
          if-no-files-found: error

  image:
    name: Hosted image
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # SpiralDB is private: a read-only deploy key on spiraldb/spiraldb checks
      # it out. The image's build context leaves this directory out.
      - name: Check out SpiralDB
        uses: actions/checkout@v6
        with:
          repository: spiraldb/spiraldb
          ref: ${{ env.SPIRALDB_REF }}
          ssh-key: ${{ secrets.SPIRALDB_DEPLOY_KEY }}
          persist-credentials: false
          path: spiraldb

      - id: spiraldb
        name: Name the SpiralDB commit
        run: echo "commit=$(git -C spiraldb rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/hosted/Dockerfile
          build-contexts: |
            spiraldb=spiraldb
            web=web
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            com.spiraldb.spiraldb.revision=${{ steps.spiraldb.outputs.commit }}
          # The registry holds every stage's layers, so the driver rebuilds
          # only when the SpiralDB commit changes.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
