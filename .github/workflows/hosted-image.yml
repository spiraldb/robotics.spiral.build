name: Hosted image

# Each release, a pushed `v*` tag, publishes the hosted Studio image, the
# flake's `hosted-image`, as `latest`. The VM in spiraldb-robotics runs `latest`
# within minutes (robotics.tf in spiraldb/infra).
on:
  push:
    tags:
      - v*

# A newer release supersedes one that is still building.
concurrency:
  group: hosted-image
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: us-docker.pkg.dev/pyspiral-dev/spiral-docker/spiral-robotics-studio

jobs:
  image:
    name: Hosted image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@v3

      # The result is a script that streams the image as a Docker archive.
      - name: Build the image
        run: nix build .#hosted-image --out-link hosted-image

      # Signed in after the build, so the token is fresh for the push.
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: projects/733253205867/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github-actions-wif@pyspiral-dev.iam.gserviceaccount.com

      # The release tag first, then `latest` on the same manifest. The source is
      # the archive built above, so no signature policy applies.
      - name: Push the image
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RELEASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          skopeo() { nix run --inputs-from . nixpkgs#skopeo -- "$@"; }
          skopeo login --username oauth2accesstoken --password-stdin us-docker.pkg.dev <<< "$ACCESS_TOKEN"
          ./hosted-image | skopeo --insecure-policy copy docker-archive:/dev/stdin "docker://$IMAGE:$RELEASE"
          skopeo --insecure-policy copy --preserve-digests "docker://$IMAGE:$RELEASE" "docker://$IMAGE:latest"
