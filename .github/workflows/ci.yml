name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Nix / Rust / Python
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Clippy invokes Cargo as a subprocess, so use Cargo's inherited
      # configuration form rather than a command-line `-Z` flag.
      CARGO_UNSTABLE_AVOID_DEV_DEPS: "true"
      CI_RUST_PACKAGES: >-
        -p spiral-robotics
        -p spiral-robotics-boundary-build
        -p spiral-robotics-contracts
        -p spiral-robotics-core
        -p spiral-robotics-inference
        -p spiral-robotics-ui
        -p spiral-robotics-studio
        -p spiral-robotics-studio-application
        -p spiral-robotics-studio-hardware
        -p spiral-robotics-training
        -p spiral-robotics-training-http
        -p spiral-robotics-viewport

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Lint workflow
        run: nix develop .#ci --command actionlint

      - name: Validate flake
        run: nix flake check --all-systems --show-trace

      - name: Build Studio stylesheet
        run: |
          mkdir -p crates/spiral-robotics-studio/assets
          nix develop .#ci --command tailwindcss \
            -i crates/spiral-robotics-studio/tailwind.css \
            -o crates/spiral-robotics-studio/assets/tailwind.css

      - name: Check formatting
        run: nix develop .#ci --command cargo fmt --all -- --check

      - name: Lint
        run: |
          read -r -a package_args <<< "$CI_RUST_PACKAGES"
          nix develop .#ci --command cargo clippy "${package_args[@]}" \
            --all-targets --locked -- \
            -D warnings -A clippy::suspicious-else-formatting

      # The native Studio backend is omitted until a separate SpiralDB
      # integration lane exists. Explicit package selection and
      # `avoid-dev-deps` keep Cargo's lock resolver off the backend and its
      # private driver source. Standard CI uses the pinned nightly toolchain.
      - name: Test without external services
        run: |
          read -r -a package_args <<< "$CI_RUST_PACKAGES"
          nix develop .#ci --command cargo test "${package_args[@]}" \
            --no-fail-fast --locked

      - name: Verify packaged boundary descriptor
        run: |
          wheel_dir="${RUNNER_TEMP}/spiral-training-wheel"
          mkdir -p "$wheel_dir"
          nix develop .#ci --command uv build --project training --wheel --out-dir "$wheel_dir"
          unzip -p "$wheel_dir"/*.whl spiral_training_runtime/boundaries.json | cmp - contracts/boundaries.json

      # The locked worker environment includes the production CUDA stack and
      # SpiralDB driver. A separate compute/integration lane will exercise it;
      # standard CI keeps the source and packaged protocol boundary checked.
      - name: Check Python source
        run: |
          nix develop .#ci --command ruff check training
          nix develop .#ci --command ruff format --check training

      - name: Check web target
        run: nix develop .#ci --command cargo check -p spiral-robotics-studio --features web --target wasm32-unknown-unknown

      - name: Validate inference contracts
        run: nix develop .#ci --command cargo test -p spiral-robotics-inference --no-default-features
