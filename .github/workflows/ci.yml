name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Nix / Rust / Python
    # A RunsOn runner, as the image build uses: the workspace's debug and test
    # builds outgrow a GitHub runner's disk.
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-studio-ci/family=c8a+m7a/cpu=16/image=ubuntu24-full-x64/volume=150gb:gp3
    timeout-minutes: 90
    env:
      CI_RUST_PACKAGES: >-
        -p spiral-robotics-common
        -p spiral-robotics-storage
        -p spiral-robotics-backend
        -p spiral-robotics-frontend
        -p spiral-robotics-hardware
        -p spiral-robotics-recording
        -p spiral-robotics-connector
        -p spiral-robotics-connector-os
        -p spiral-robotics-viewport

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Lint workflow
        run: nix develop .#ci --command actionlint

      - name: Validate flake
        run: nix flake check --all-systems --show-trace

      - name: Build Studio stylesheet
        run: |
          mkdir -p crates/frontend/assets
          nix develop .#ci --command tailwindcss \
            -i crates/frontend/tailwind.css \
            -o crates/frontend/assets/tailwind.css

      - name: Check formatting
        run: nix develop .#ci --command cargo fmt --all -- --check

      # The published SDK verifies its public native archive and exports
      # SPIRAL_NATIVE_DIR to later steps.
      - name: Install the Spiral SDK's native runtime
        run: nix develop .#ci --command scripts/setup-spiral-sdk.sh

      - name: Lint
        run: |
          read -r -a package_args <<< "$CI_RUST_PACKAGES"
          nix develop .#ci --command cargo clippy "${package_args[@]}" \
            --all-targets --locked -- \
            -D warnings -A clippy::suspicious-else-formatting

      # Tests run Studio's SQL on DataFusion's in-memory tables, so they need
      # neither Spiral's runtime nor hosted services.
      - name: Test without external services
        run: |
          read -r -a package_args <<< "$CI_RUST_PACKAGES"
          nix develop .#ci --command cargo test "${package_args[@]}" \
            --no-fail-fast --locked

      - name: Check Python source
        run: |
          nix develop .#ci --command ruff check modal/training
          nix develop .#ci --command ruff format --check modal/training

      - name: Check native server without the frontend
        run: nix develop .#ci --command cargo check -p spiral-robotics-backend --bin spiral-robotics-backend --locked

      - name: Check web target
        run: nix develop .#ci --command cargo check -p spiral-robotics-frontend --bin spiral-robotics-frontend --target wasm32-unknown-unknown --locked

      - name: Lint browser frontend
        run: |
          nix develop .#ci --command cargo clippy -p spiral-robotics-frontend \
            --lib --tests --target wasm32-unknown-unknown --locked -- \
            -D warnings -A clippy::suspicious-else-formatting

      - name: Test frontend in headless Firefox
        env:
          WASM_BINDGEN_TEST_TIMEOUT: 60
        run: |
          nix develop .#ci --command cargo test -p spiral-robotics-frontend \
            --lib --target wasm32-unknown-unknown --locked
