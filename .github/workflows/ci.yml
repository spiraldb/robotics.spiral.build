name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Nix / Rust / Python
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Configure locked Spiral driver source
        env:
          GH_TOKEN: ${{ github.token }}
          SPIRALDB_DEPLOY_KEY: ${{ secrets.SPIRALDB_DEPLOY_KEY }}
        run: |
          key_dir="${RUNNER_TEMP}/spiraldb-ssh"
          install -d -m 700 "$key_dir"
          printf '%s\n' "$SPIRALDB_DEPLOY_KEY" > "$key_dir/id_ed25519"
          chmod 600 "$key_dir/id_ed25519"
          gh api meta --jq '.ssh_keys[] | "github.com \(.)"' > "$key_dir/known_hosts"
          git config --global url."git@github.com:spiraldb/spiraldb.git".insteadOf \
            "https://github.com/spiraldb/spiraldb.git"
          git config --global core.sshCommand \
            "ssh -i $key_dir/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$key_dir/known_hosts"

      - name: Lint workflow
        run: nix develop .#ci --command actionlint

      - name: Validate flake
        run: nix flake check --all-systems --show-trace

      - name: Check formatting
        run: nix develop .#ci --command cargo fmt --all -- --check

      - name: Lint
        run: |
          nix develop .#ci --command cargo clippy --workspace --all-targets -- -D warnings -A clippy::suspicious-else-formatting
          nix develop .#ci --command cargo clippy -p spiral-robotics-studio --all-targets --features server -- -D warnings -A clippy::suspicious-else-formatting

      # Tests that require SpiralDB, SpFS, downloadable model artifacts, or
      # disposable hosted projects are explicitly #[ignore] in Rust. CI runs
      # all remaining deterministic tests without any external service.
      - name: Test without external services
        run: |
          nix develop .#ci --command cargo test --workspace --no-fail-fast
          nix develop .#ci --command cargo test -p spiral-robotics-studio --features server --no-fail-fast

      - name: Install locked Python runtime
        run: nix develop .#ci --command uv sync --project training --frozen --extra dev

      - name: Verify packaged boundary descriptor
        run: |
          wheel_dir="${RUNNER_TEMP}/spiral-training-wheel"
          mkdir -p "$wheel_dir"
          nix develop .#ci --command uv build --project training --wheel --out-dir "$wheel_dir"
          unzip -p "$wheel_dir"/*.whl spiral_training_runtime/boundaries.json | cmp - contracts/boundaries.json

      - name: Check Python runtime
        run: |
          nix develop .#ci --command uv run --project training ruff check training
          nix develop .#ci --command uv run --project training ruff format --check training
          nix develop .#ci --command uv run --project training pytest -q training/tests

      - name: Check web target
        run: nix develop .#ci --command cargo check -p spiral-robotics-studio --features web --target wasm32-unknown-unknown

      - name: Validate inference contracts
        run: nix develop .#ci --command cargo test -p spiral-robotics-inference --no-default-features
